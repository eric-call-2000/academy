<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1044" role="img" aria-labelledby="t">
<title id="t">How power works in Russia</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/></marker>
<style>text{font-family:"Nunito","Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1c1d20}.h{font-size:27px;font-weight:900;fill:#fff;letter-spacing:1px}.hs{font-size:20px;font-weight:700;fill:#fff;opacity:.92}.li{font-size:23px;font-weight:600}.lab{font-size:19px;font-weight:800;fill:#5b6270}.band{font-size:25px;font-weight:900;letter-spacing:1px}.bands{font-size:19px;font-weight:700;fill:#3f4148}</style>
</defs>
<rect width="760" height="1044" fill="#ffffff"/>
<rect x="40" y="22" width="680" height="72" rx="36" fill="#eef1f5" stroke="#cfd6df" stroke-width="2"/>
<text x="380" y="54" text-anchor="middle" class="band">THE VOTERS</text>
<text x="380" y="80" text-anchor="middle" class="bands">elections are held, but opponents are barred or jailed</text>
<line x1="170" y1="96" x2="170" y2="144" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="148" width="680" height="172" rx="18" fill="#f7f8fa" stroke="#4a4e69" stroke-width="3"/>
<path d="M40 166 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#4a4e69"/>
<text x="62" y="186" class="h">PRESIDENT</text>
<text x="700" y="186" text-anchor="end" class="hs">Vladimir Putin</text>
<text x="62" y="236" class="li">In power since 2000 (PM 2008–12)</text>
<text x="62" y="270" class="li">Can run until 2036 under 2020 changes</text>
<text x="62" y="304" class="li">Commands the army and security services</text>
<line x1="170" y1="322" x2="170" y2="370" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="354" class="lab">appoints</text>
<rect x="40" y="374" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#5b6270" stroke-width="3"/>
<path d="M40 392 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#5b6270"/>
<text x="62" y="412" class="h">GOVERNMENT</text>
<text x="700" y="412" text-anchor="end" class="hs">runs the economy</text>
<text x="62" y="462" class="li">Prime Minister Mikhail Mishustin</text>
<text x="62" y="496" class="li">Ministries report to the president</text>
<line x1="170" y1="514" x2="170" y2="562" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="546" class="lab">passes the laws it sends</text>
<rect x="40" y="566" width="680" height="172" rx="18" fill="#f7f8fa" stroke="#6b5b7a" stroke-width="3"/>
<path d="M40 584 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#6b5b7a"/>
<text x="62" y="604" class="h">PARLIAMENT</text>
<text x="700" y="604" text-anchor="end" class="hs">approves</text>
<text x="62" y="654" class="li">State Duma: 450 seats</text>
<text x="62" y="688" class="li">United Russia holds 349 (2026)</text>
<text x="62" y="722" class="li">Federation Council: regions' upper house</text>
<line x1="170" y1="740" x2="170" y2="788" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="772" class="lab">watched by</text>
<rect x="40" y="792" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#3a3a4a" stroke-width="3"/>
<path d="M40 810 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#3a3a4a"/>
<text x="62" y="830" class="h">SECURITY STATE</text>
<text x="700" y="830" text-anchor="end" class="hs">the siloviki</text>
<text x="62" y="880" class="li">FSB, army, National Guard</text>
<text x="62" y="914" class="li">Security Council run by Sergei Shoigu</text>
<rect x="40" y="950" width="680" height="72" rx="36" fill="#f7f4ec" stroke="#d8cfb8" stroke-width="2"/>
<text x="380" y="982" text-anchor="middle" class="band">REGIONS</text>
<text x="380" y="1008" text-anchor="middle" class="bands">governors are elected, but candidates are vetted</text>
</svg>
