<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 976" role="img" aria-labelledby="t">
<title id="t">How power works in Belarus</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/></marker>
<style>text{font-family:"Nunito","Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1c1d20}.h{font-size:27px;font-weight:900;fill:#fff;letter-spacing:1px}.hs{font-size:20px;font-weight:700;fill:#fff;opacity:.92}.li{font-size:23px;font-weight:600}.lab{font-size:19px;font-weight:800;fill:#5b6270}.band{font-size:25px;font-weight:900;letter-spacing:1px}.bands{font-size:19px;font-weight:700;fill:#3f4148}</style>
</defs>
<rect width="760" height="976" fill="#ffffff"/>
<rect x="40" y="22" width="680" height="72" rx="36" fill="#eef1f5" stroke="#cfd6df" stroke-width="2"/>
<text x="380" y="54" text-anchor="middle" class="band">THE VOTERS</text>
<text x="380" y="80" text-anchor="middle" class="bands">elections judged neither free nor fair</text>
<line x1="170" y1="96" x2="170" y2="144" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="148" width="680" height="172" rx="18" fill="#f7f8fa" stroke="#9b3b3b" stroke-width="3"/>
<path d="M40 166 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#9b3b3b"/>
<text x="62" y="186" class="h">PRESIDENT</text>
<text x="700" y="186" text-anchor="end" class="hs">Alexander Lukashenko</text>
<text x="62" y="236" class="li">In power since 1994</text>
<text x="62" y="270" class="li">Appoints government, judges, governors</text>
<text x="62" y="304" class="li">Rules by decree</text>
<line x1="170" y1="322" x2="170" y2="370" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="354" class="lab">also chairs</text>
<rect x="40" y="374" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#6b4f8a" stroke-width="3"/>
<path d="M40 392 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#6b4f8a"/>
<text x="62" y="412" class="h">PEOPLE'S ASSEMBLY</text>
<text x="700" y="412" text-anchor="end" class="hs">about 1,200 loyalists</text>
<text x="62" y="462" class="li">Created by the 2022 constitution</text>
<text x="62" y="496" class="li">Can override parliament</text>
<line x1="170" y1="514" x2="170" y2="562" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="546" class="lab">above</text>
<rect x="40" y="566" width="680" height="104" rx="18" fill="#f7f8fa" stroke="#5b6270" stroke-width="3"/>
<path d="M40 584 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#5b6270"/>
<text x="62" y="604" class="h">NATIONAL ASSEMBLY</text>
<text x="700" y="604" text-anchor="end" class="hs">no opposition</text>
<text x="62" y="654" class="li">Passes the president's laws</text>
<line x1="170" y1="672" x2="170" y2="720" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="704" class="lab">enforced by</text>
<rect x="40" y="724" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#3e3a44" stroke-width="3"/>
<path d="M40 742 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#3e3a44"/>
<text x="62" y="762" class="h">KGB AND POLICE</text>
<text x="700" y="762" text-anchor="end" class="hs">repression</text>
<text x="62" y="812" class="li">More than 800 political prisoners</text>
<text x="62" y="846" class="li">Over 65,000 detained since 2020</text>
<rect x="40" y="882" width="680" height="72" rx="36" fill="#f7f4ec" stroke="#d8cfb8" stroke-width="2"/>
<text x="380" y="914" text-anchor="middle" class="band">MAIN BACKER</text>
<text x="380" y="940" text-anchor="middle" class="bands">Russia, through the Union State</text>
</svg>
