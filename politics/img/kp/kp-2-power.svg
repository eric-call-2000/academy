<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 976" role="img" aria-labelledby="t">
<title id="t">How power works in North Korea</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/></marker>
<style>text{font-family:"Nunito","Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1c1d20}.h{font-size:27px;font-weight:900;fill:#fff;letter-spacing:1px}.hs{font-size:20px;font-weight:700;fill:#fff;opacity:.92}.li{font-size:23px;font-weight:600}.lab{font-size:19px;font-weight:800;fill:#5b6270}.band{font-size:25px;font-weight:900;letter-spacing:1px}.bands{font-size:19px;font-weight:700;fill:#3f4148}</style>
</defs>
<rect width="760" height="976" fill="#ffffff"/>
<rect x="40" y="22" width="680" height="72" rx="36" fill="#eef1f5" stroke="#cfd6df" stroke-width="2"/>
<text x="380" y="54" text-anchor="middle" class="band">THE LEADER</text>
<text x="380" y="80" text-anchor="middle" class="bands">Kim Jong Un, third of the Kim dynasty, since 2011</text>
<line x1="170" y1="96" x2="170" y2="144" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="148" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#6b2737" stroke-width="3"/>
<path d="M40 166 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#6b2737"/>
<text x="62" y="186" class="h">WORKERS' PARTY OF KOREA</text>
<text x="700" y="186" text-anchor="end" class="hs">the only party</text>
<text x="62" y="236" class="li">General secretary: Kim Jong Un</text>
<text x="62" y="270" class="li">Congress every five years sets the line</text>
<line x1="170" y1="288" x2="170" y2="336" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="320" class="lab">commands</text>
<rect x="40" y="340" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#8a3b2e" stroke-width="3"/>
<path d="M40 358 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#8a3b2e"/>
<text x="62" y="378" class="h">KOREAN PEOPLE'S ARMY</text>
<text x="700" y="378" text-anchor="end" class="hs">about 1.3 million</text>
<text x="62" y="428" class="li">Nuclear forces answer to Kim</text>
<text x="62" y="462" class="li">Troops sent to fight for Russia</text>
<line x1="170" y1="480" x2="170" y2="528" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="512" class="lab">and</text>
<rect x="40" y="532" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#5b6270" stroke-width="3"/>
<path d="M40 550 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#5b6270"/>
<text x="62" y="570" class="h">STATE AFFAIRS COMMISSION</text>
<text x="700" y="570" text-anchor="end" class="hs">the state</text>
<text x="62" y="620" class="li">Chaired by Kim as 'president'</text>
<text x="62" y="654" class="li">Cabinet runs the economy</text>
<line x1="170" y1="672" x2="170" y2="720" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="704" class="lab">controls</text>
<rect x="40" y="724" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#1f4e79" stroke-width="3"/>
<path d="M40 742 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#1f4e79"/>
<text x="62" y="762" class="h">SECURITY SERVICES</text>
<text x="700" y="762" text-anchor="end" class="hs">surveillance</text>
<text x="62" y="812" class="li">Watch every citizen</text>
<text x="62" y="846" class="li">Political prison camps</text>
<rect x="40" y="882" width="680" height="72" rx="36" fill="#f7f4ec" stroke="#d8cfb8" stroke-width="2"/>
<text x="380" y="914" text-anchor="middle" class="band">SUPREME PEOPLE'S ASSEMBLY</text>
<text x="380" y="940" text-anchor="middle" class="bands">a rubber-stamp parliament with single-candidate elections</text>
</svg>
