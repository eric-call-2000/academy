<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1010" role="img" aria-labelledby="t">
<title id="t">How power works in Turkey</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/></marker>
<style>text{font-family:"Nunito","Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1c1d20}.h{font-size:27px;font-weight:900;fill:#fff;letter-spacing:1px}.hs{font-size:20px;font-weight:700;fill:#fff;opacity:.92}.li{font-size:23px;font-weight:600}.lab{font-size:19px;font-weight:800;fill:#5b6270}.band{font-size:25px;font-weight:900;letter-spacing:1px}.bands{font-size:19px;font-weight:700;fill:#3f4148}</style>
</defs>
<rect width="760" height="1010" fill="#ffffff"/>
<rect x="40" y="22" width="680" height="72" rx="36" fill="#eef1f5" stroke="#cfd6df" stroke-width="2"/>
<text x="380" y="54" text-anchor="middle" class="band">THE VOTERS</text>
<text x="380" y="80" text-anchor="middle" class="bands">elect the president and 600 MPs</text>
<line x1="170" y1="96" x2="170" y2="144" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="148" width="680" height="172" rx="18" fill="#f7f8fa" stroke="#b5462f" stroke-width="3"/>
<path d="M40 166 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#b5462f"/>
<text x="62" y="186" class="h">PRESIDENT</text>
<text x="700" y="186" text-anchor="end" class="hs">Recep Tayyip Erdoğan</text>
<text x="62" y="236" class="li">Head of state and government</text>
<text x="62" y="270" class="li">Rules by decree; appoints ministers</text>
<text x="62" y="304" class="li">Names many senior judges</text>
<line x1="170" y1="322" x2="170" y2="370" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="354" class="lab">outweighs</text>
<rect x="40" y="374" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#1f4e79" stroke-width="3"/>
<path d="M40 392 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#1f4e79"/>
<text x="62" y="412" class="h">GRAND NATIONAL ASSEMBLY</text>
<text x="700" y="412" text-anchor="end" class="hs">600 seats</text>
<text x="62" y="462" class="li">AKP and MHP hold a majority</text>
<text x="62" y="496" class="li">Can call early elections by 3/5</text>
<line x1="170" y1="514" x2="170" y2="562" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="546" class="lab">shaped by</text>
<rect x="40" y="566" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#5b6270" stroke-width="3"/>
<path d="M40 584 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#5b6270"/>
<text x="62" y="604" class="h">COURTS AND PROSECUTORS</text>
<text x="700" y="604" text-anchor="end" class="hs">politically aligned</text>
<text x="62" y="654" class="li">Cases against opposition mayors</text>
<text x="62" y="688" class="li">Rulings often favour the government</text>
<line x1="170" y1="706" x2="170" y2="754" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="738" class="lab">resisted by</text>
<rect x="40" y="758" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#6b4f8a" stroke-width="3"/>
<path d="M40 776 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#6b4f8a"/>
<text x="62" y="796" class="h">OPPOSITION CITIES</text>
<text x="700" y="796" text-anchor="end" class="hs">CHP</text>
<text x="62" y="846" class="li">Won most big cities in 2024</text>
<text x="62" y="880" class="li">Many mayors jailed or removed</text>
<rect x="40" y="916" width="680" height="72" rx="36" fill="#f7f4ec" stroke="#d8cfb8" stroke-width="2"/>
<text x="380" y="948" text-anchor="middle" class="band">NEXT ELECTIONS</text>
<text x="380" y="974" text-anchor="middle" class="bands">due by May 2028; talk of an earlier vote</text>
</svg>
