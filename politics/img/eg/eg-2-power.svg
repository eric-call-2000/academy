<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 976" role="img" aria-labelledby="t">
<title id="t">How power works in Egypt</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/></marker>
<style>text{font-family:"Nunito","Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1c1d20}.h{font-size:27px;font-weight:900;fill:#fff;letter-spacing:1px}.hs{font-size:20px;font-weight:700;fill:#fff;opacity:.92}.li{font-size:23px;font-weight:600}.lab{font-size:19px;font-weight:800;fill:#5b6270}.band{font-size:25px;font-weight:900;letter-spacing:1px}.bands{font-size:19px;font-weight:700;fill:#3f4148}</style>
</defs>
<rect width="760" height="976" fill="#ffffff"/>
<rect x="40" y="22" width="680" height="72" rx="36" fill="#eef1f5" stroke="#cfd6df" stroke-width="2"/>
<text x="380" y="54" text-anchor="middle" class="band">THE VOTERS</text>
<text x="380" y="80" text-anchor="middle" class="bands">elect a president and parliament; turnout low</text>
<line x1="170" y1="96" x2="170" y2="144" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="148" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#a0782b" stroke-width="3"/>
<path d="M40 166 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#a0782b"/>
<text x="62" y="186" class="h">PRESIDENT</text>
<text x="700" y="186" text-anchor="end" class="hs">Abdel Fattah el-Sisi</text>
<text x="62" y="236" class="li">Since 2014; term runs to 2030</text>
<text x="62" y="270" class="li">Appoints the PM and top judges</text>
<line x1="170" y1="288" x2="170" y2="336" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="320" class="lab">rests on</text>
<rect x="40" y="340" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#8a3b2e" stroke-width="3"/>
<path d="M40 358 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#8a3b2e"/>
<text x="62" y="378" class="h">ARMY AND INTELLIGENCE</text>
<text x="700" y="378" text-anchor="end" class="hs">the real base</text>
<text x="62" y="428" class="li">Guardians of the state</text>
<text x="62" y="462" class="li">Large business interests</text>
<line x1="170" y1="480" x2="170" y2="528" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="512" class="lab">appoints</text>
<rect x="40" y="532" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#2b6cb0" stroke-width="3"/>
<path d="M40 550 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#2b6cb0"/>
<text x="62" y="570" class="h">PRIME MINISTER AND CABINET</text>
<text x="700" y="570" text-anchor="end" class="hs">Mostafa Madbouly</text>
<text x="62" y="620" class="li">Runs the economy and services</text>
<text x="62" y="654" class="li">Negotiates with the IMF</text>
<line x1="170" y1="672" x2="170" y2="720" stroke="#5b6270" stroke-width="3" marker-end="url(#ah)"/>
<text x="184" y="704" class="lab">backed by</text>
<rect x="40" y="724" width="680" height="138" rx="18" fill="#f7f8fa" stroke="#1f4e79" stroke-width="3"/>
<path d="M40 742 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v38 h-680 z" fill="#1f4e79"/>
<text x="62" y="762" class="h">PARLIAMENT</text>
<text x="700" y="762" text-anchor="end" class="hs">pro-Sisi majority</text>
<text x="62" y="812" class="li">House and Senate dominated by</text>
<text x="62" y="846" class="li">parties loyal to the president</text>
<rect x="40" y="882" width="680" height="72" rx="36" fill="#f7f4ec" stroke="#d8cfb8" stroke-width="2"/>
<text x="380" y="914" text-anchor="middle" class="band">NEXT PRESIDENTIAL ELECTION</text>
<text x="380" y="940" text-anchor="middle" class="bands">due 2029–30</text>
</svg>
