<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academy: courses in AI, building, psychology and more</title>
  <meta name="description" content="Self-paced courses in AI, system design, construction and BIM, marketing and psychology, plus hands-on labs in coding, accounting and world politics." />
  <meta property="og:title" content="Academy" />
  <meta property="og:description" content="Self-paced courses in AI, system design, construction and BIM, marketing and psychology, plus hands-on labs." />
  <meta name="theme-color" content="#f4f4f1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1e22'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='20' fill='%23f4f4f1'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"><div class="boot">Loading courses…</div></div>

  <!--
    LOADER
    ------
    1. Loads tracks.js, which defines each course (track) and its unit count.
    2. For each track, loads <prefix>-unit1.js … <prefix>-unitN.js (N = track.count),
       all downloading in parallel but running in order.
    3. Starts the app (app.js runs last).

    >>> TO ADD A UNIT: drop in <prefix>-unitN.js and bump that track's `count` in tracks.js.
        TO ADD A TRACK: add a defineTrack({...}) in tracks.js with a new prefix + files.
    (See unit-template.txt for the shape of a unit file.)
  -->
  <script src="tracks.js"></script>
  <script>
  (function () {
    // Every unit file starts downloading at once, then they run in list order
    // (async = false keeps the order), with app.js last. A missing file is
    // skipped. Loading them one after another made the first visit take ~15 s.
    var tracks = (window.ACADEMY && window.ACADEMY.tracks) || [];
    var files = [];
    tracks.forEach(function (tr) {
      var n = tr.count || 0;
      for (var i = 1; i <= n; i++) files.push((tr.prefix || tr.id) + "-unit" + i + ".js");
    });
    files.push("app.js");   // no tracks.js -> app.js alone shows a friendly "no tracks" message
    files.forEach(function (src) {
      var s = document.createElement("script");
      s.src = src;
      s.async = false;
      document.head.appendChild(s);
    });
  })();
  </script>
</body>
</html>
